# self-runner configuration (key=value, parsed, never sourced)
repository=OWNER/REPO
scope=repo
colima_profile=self-runner
# Use a new immutable tag for every reviewed image change; never retag.
image_tag=r2.337.0-1
# Teams: auto = your gh login. Runner is named <login>-<lane>-1 and gets a
# personal label; `route <lane> on` marks you on duty. See README.
# user=auto
# auto_route=true
lanes=ci

lane.ci.label=self-runner-ci
lane.ci.cpus=2.0
lane.ci.memory=3g
lane.ci.pids=512

# Optional privileged lane (e.g. Tailscale-based deploys). Trusted workflows only.
# lanes=ci,deploy
# lane.deploy.label=self-runner-deploy,my-host
# lane.deploy.cpus=1.5
# lane.deploy.sudo=true
# lane.deploy.cap_add=NET_ADMIN
# lane.deploy.devices=/dev/net/tun
